name: Build & Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            rust-targets: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Gmail-Credentials aus GitHub Secrets als .env ────────────────────
      - name: Create .env from secrets
        shell: bash
        run: |
          echo "VITE_GMAIL_CLIENT_ID=${{ secrets.VITE_GMAIL_CLIENT_ID }}" >> .env
          echo "VITE_GMAIL_CLIENT_SECRET=${{ secrets.VITE_GMAIL_CLIENT_SECRET }}" >> .env

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libfuse2 libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev libssl-dev \
            libayatana-appindicator3-dev libayatana-indicator3-dev

      - name: Install create-dmg (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install create-dmg

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Inject version from tag into tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "Setting tauri.conf.json version to: $VERSION"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Rechnungs-Manager ${{ github.ref_name }}'
          releaseBody: 'Neuer Release'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.args || 'default' }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app
          if-no-files-found: warn

  # ── Android-APK ─────────────────────────────────────────────────────────────
  # Baut die Handy-App und hängt das signierte APK an dasselbe Release an.
  # Optionale Secrets für stabile Signatur (sonst wird ein CI-Wegwerf-Key
  # erzeugt und Updates erfordern eine Neuinstallation):
  #   ANDROID_KEYSTORE_B64      – base64-kodierte .jks-Datei
  #   ANDROID_KEYSTORE_PASSWORD – Keystore-Passwort
  #   ANDROID_KEY_ALIAS         – Key-Alias
  #   ANDROID_KEY_PASSWORD      – Key-Passwort
  # Läuft von Anfang an neben den Desktop-Builds, nicht hinter ihnen: Der
  # Android-Build braucht nichts von ihnen. Nur der letzte Schritt setzt das
  # Release voraus, das der Desktop-Job anlegt – und der wartet ohnehin
  # darauf, bis es da ist.
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from secrets
        shell: bash
        run: |
          echo "VITE_GMAIL_CLIENT_ID=${{ secrets.VITE_GMAIL_CLIENT_ID }}" >> .env
          echo "VITE_GMAIL_CLIENT_SECRET=${{ secrets.VITE_GMAIL_CLIENT_SECRET }}" >> .env

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Rust stable (Android-Targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - name: Setup Android NDK
        shell: bash
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm install

      - name: Inject version from tag into tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Initialize Android project
        shell: bash
        run: |
          # Im Repo liegt nur ein Teil von gen/android (die von `tauri icon`
          # erzeugten App-Icons). `tauri android init` verweigert bei einem
          # unvollständigen Ordner – daher: Icons sichern, frisch generieren,
          # Icons zurückkopieren.
          if [ -d src-tauri/gen/android ]; then
            if [ -d src-tauri/gen/android/app/src/main/res ]; then
              cp -r src-tauri/gen/android/app/src/main/res /tmp/klevr-res
            fi
            rm -rf src-tauri/gen/android
          fi
          npx tauri android init
          if [ -d /tmp/klevr-res ]; then
            cp -r /tmp/klevr-res/. src-tauri/gen/android/app/src/main/res/
          fi

      - name: Patch AndroidManifest (Kamera + Update-Installation + Portrait-Lock)
        shell: bash
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          # Kamera-Berechtigung für den Beleg-Scan
          perl -0pi -e 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$MANIFEST"
          # Update-Installation: Ohne diese Berechtigung darf die App die
          # heruntergeladene APK nicht an den Paket-Installer übergeben –
          # Android blockt das dann als "unbekannte Quelle" ohne Ausweg.
          perl -0pi -e 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application|' "$MANIFEST"
          # Rotation-Lock: App läuft nur im Hochformat
          perl -0pi -e 's|<activity(?![^>]*screenOrientation)|<activity android:screenOrientation="portrait"|g' "$MANIFEST"
          cat "$MANIFEST"

      - name: Systemleisten an den Hell-/Dunkelmodus koppeln
        shell: bash
        run: |
          # Die App zeichnet bis unter die Statusleiste, deren Symbole malt
          # aber weiter Android. Ohne diese Angabe bleiben sie immer hell –
          # auf hellem Grund sieht man dann oben schlicht nichts.
          #
          # `windowLightStatusBar` heißt "heller Hintergrund, also dunkle
          # Symbole": in der Tag-Fassung des Themes wahr, in der Nacht-Fassung
          # falsch. Damit folgen die Symbole dem Hell-/Dunkelmodus des
          # Telefons – und die App tut das im Modus „Automatisch" ebenfalls.
          #
          # Der Name des Themes richtet sich nach der App ("Theme.<name>"),
          # deshalb greift das Muster auf den Anfang und nicht auf einen
          # festen Namen.
          RES="src-tauri/gen/android/app/src/main/res"
          for variant in "values:true" "values-night:false"; do
            dir="${variant%%:*}"
            light="${variant##*:}"
            file="$RES/$dir/themes.xml"
            [ -f "$file" ] || continue
            perl -0pi -e "s|(<style name=\"Theme\.[^\"]*\"[^>]*>)|\$1\n        <item name=\"android:windowLightStatusBar\">$light</item>\n        <item name=\"android:windowLightNavigationBar\">$light</item>|" "$file"
            cat "$file"
          done

      - name: FileProvider auf den App-Ordner ausweiten
        shell: bash
        run: |
          # Dateien aus dem eigenen Ordner darf eine App auf Android nicht als
          # Pfad weiterreichen – sie geht als `content://`-Verweis über den
          # FileProvider, der pro Datei Leserecht vergibt. Der Provider steckt
          # schon im erzeugten Projekt; seine Liste kennt aber nur den
          # externen Speicher und den Zwischenspeicher. Belege und die
          # heruntergeladene APK liegen im Datenordner der App, deshalb kommt
          # hier ein Eintrag dafür dazu. Der Provider ist nicht exportiert,
          # das Leserecht gilt jeweils nur für die übergebene Datei.
          PATHS="src-tauri/gen/android/app/src/main/res/xml/file_paths.xml"
          perl -0pi -e 's|(<paths[^>]*>)|$1\n  <root-path name="root" path="." />|' "$PATHS"
          cat "$PATHS"

      - name: FileProvider vor dem Wegoptimieren schützen
        shell: bash
        run: |
          # Der Release-Build lässt R8 über den Java-Code laufen, und R8
          # wirft weg, was niemand aufruft. `FileProvider.getUriForFile`
          # ruft nur unser Rust-Code über JNI auf – das sieht R8 nicht,
          # also flog die Methode raus ("NoSuchMethodError"). Die Klasse
          # selbst blieb stehen, weil das Manifest sie nennt.
          #
          # Der Build zieht jede *.pro-Datei im App-Ordner heran, ein
          # Anhängen genügt also.
          RULES="src-tauri/gen/android/app/proguard-rules.pro"
          echo "" >> "$RULES"
          echo "# Wird ausschliesslich ueber JNI aufgerufen (src/open_external.rs)." >> "$RULES"
          echo "# Ohne diese Zeile entfernt R8 die Methode, und das Weiterreichen" >> "$RULES"
          echo "# von PDF und APK scheitert erst zur Laufzeit." >> "$RULES"
          echo "-keep class androidx.core.content.FileProvider { *; }" >> "$RULES"
          tail -6 "$RULES"
      - name: Build APK
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android -name "*release-unsigned.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -path "*release*" -name "*.apk" | head -1)
          fi
          echo "Gefundenes APK: $APK"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > klevr.jks
            ALIAS="${KEY_ALIAS:-klevr}"
            STOREPASS="$KEYSTORE_PASSWORD"
            KEYPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::Kein ANDROID_KEYSTORE_B64-Secret gesetzt – erzeuge CI-Wegwerf-Key. Updates erfordern dann eine Neuinstallation der App!"
            keytool -genkeypair -keystore klevr.jks -alias klevr -storepass klevr-ci -keypass klevr-ci \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Klevr CI"
            ALIAS="klevr"; STOREPASS="klevr-ci"; KEYPASS="klevr-ci"
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          OUT="Klevr_${VERSION}_android.apk"

          "$BUILD_TOOLS/zipalign" -f 4 "$APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks klevr.jks --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" \
            --out "$OUT" aligned.apk
          "$BUILD_TOOLS/apksigner" verify "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: ${{ env.APK_PATH }}

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Das (Draft-)Release legt der Desktop-Job an. Da beide Jobs
          # gleichzeitig starten, ist die APK oft zuerst fertig – dann wartet
          # dieser Schritt, bis das Release existiert.
          for i in $(seq 1 30); do
            if gh release upload "${{ github.ref_name }}" "$APK_PATH" --clobber -R "${{ github.repository }}"; then
              echo "APK ans Release angehängt."
              exit 0
            fi
            echo "Release noch nicht da – warte 30 s ($i/30) …"
            sleep 30
          done
          echo "::error::Release für ${{ github.ref_name }} nicht gefunden."
          exit 1

  # ── iOS-IPA ─────────────────────────────────────────────────────────────────
  # Baut eine Ad-hoc-IPA und hängt sie ans selbe Release an. Anders als beim
  # Android-APK gibt es für iOS keinen Wegwerf-Signaturweg: Apple verlangt ein
  # echtes Entwicklerzertifikat + ein dazu passendes Provisioning-Profile, das
  # nur Geräte enthalten kann, die vorher im Apple-Developer-Portal registriert
  # wurden. Ohne die Secrets unten macht ein Build daher schlicht keinen Sinn –
  # der Job überspringt sich dann selbst, statt mit einem kaputten Signatur-
  # Schritt zu scheitern. Siehe MOBILE.md ("iOS-IPA") für die Secret-Liste und
  # wie man ein Ad-hoc-Provisioning-Profile erstellt.
  ios:
    permissions:
      contents: write
    runs-on: macos-latest
    if: |
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      env.IOS_SECRETS_PRESENT == 'true'
    env:
      IOS_SECRETS_PRESENT: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' && secrets.IOS_MOBILEPROVISION_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from secrets
        shell: bash
        run: |
          echo "VITE_GMAIL_CLIENT_ID=${{ secrets.VITE_GMAIL_CLIENT_ID }}" >> .env
          echo "VITE_GMAIL_CLIENT_SECRET=${{ secrets.VITE_GMAIL_CLIENT_SECRET }}" >> .env

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable (iOS-Target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ios

      - name: Install frontend dependencies
        run: npm install

      - name: Inject version from tag into tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Import signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo "$MOBILEPROVISION_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

      - name: Apply Release-only Swift symbol-visibility workaround
        shell: bash
        run: |
          # cargo fetch first, so the crates this patches (tauri, plugins,
          # swift-rs) actually exist in the local registry cache yet.
          (cd src-tauri && cargo fetch --target aarch64-apple-ios)
          ./scripts/ios-release-swift-patch.sh

      - name: Initialize iOS project
        shell: bash
        run: |
          # Wie beim Android-Job: nur der von `tauri icon` erzeugte
          # Icon-Ordner liegt im Repo, das restliche Xcode-Projekt wird
          # frisch generiert.
          if [ -d src-tauri/gen/apple ]; then
            if [ -d src-tauri/gen/apple/Assets.xcassets ]; then
              cp -r src-tauri/gen/apple/Assets.xcassets /tmp/klevr-assets
            fi
            rm -rf src-tauri/gen/apple
          fi
          npx tauri ios init
          if [ -d /tmp/klevr-assets ]; then
            cp -r /tmp/klevr-assets/. src-tauri/gen/apple/Assets.xcassets/
          fi

      - name: Patch Info.plist (Kamera + Scene-Lifecycle + Portrait-Lock) und Deployment-Target
        shell: bash
        run: |
          set -euo pipefail
          PLIST="src-tauri/gen/apple/rechnungs-manager_iOS/Info.plist"

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Klevr benötigt Kamerazugriff, um Belege zu scannen.'" "$PLIST" 2>/dev/null || true

          # UIScene-Lifecycle deklarieren (der tao-Patch braucht das zusätzlich
          # zur Delegate-Implementierung, siehe vendor/tao-0.34.8).
          /usr/libexec/PlistBuddy -c "Delete :UIApplicationSceneManifest" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes bool false" "$PLIST"

          # Portrait-Lock
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"

          plutil -lint "$PLIST"

          # Deployment-Target: die von `tauri ios init` erzeugte Vorgabe
          # (14.0) liegt unterhalb dessen, was aktuelle Xcode-Versionen noch
          # akzeptieren.
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14\.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' \
            src-tauri/gen/apple/rechnungs-manager.xcodeproj/project.pbxproj
          sed -i '' 's/iOS: 14\.0/iOS: 15.0/' src-tauri/gen/apple/project.yml

      - name: Build IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri ios build --export-method release-testing --target aarch64

      - name: Rename IPA
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" | head -1)
          OUT="Klevr_${VERSION}_ios.ipa"
          cp "$IPA" "$OUT"
          echo "IPA_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-ios
          path: ${{ env.IPA_PATH }}

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            if gh release upload "${{ github.ref_name }}" "$IPA_PATH" --clobber -R "${{ github.repository }}"; then
              echo "IPA ans Release angehängt."
              exit 0
            fi
            echo "Release noch nicht da – warte 30 s ($i/30) …"
            sleep 30
          done
          echo "::error::Release für ${{ github.ref_name }} nicht gefunden."
          exit 1